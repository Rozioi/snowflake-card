<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Card</title>
    <link href="index.css" rel="stylesheet">
    <script defer src="fall.js"></script>
</head>
<body>
<div class="task-card">
    <div class="snowflakes">
        <div class="snowflake">❄</div>
    </div>
    <div class="task-header">
        Grocery shopping
    </div>
    <div class="task-content">
        <div class="task-row">
            <span>Description: </span>
            Buy vegetables, fruits, and snacks
        </div>
        <div class="task-row">
            <span>Status: </span>
            <span class="status">In Progress</span>
        </div>
        <div class="task-row">
            <span>Priority: </span>
            <span class="priority">High</span>
        </div>
        <div class="task-row">
            <span>Created on: </span>
            2025-01-05
        </div>
        <div class="task-row">
            <span>Due Date: </span>
            2025-01-06
        </div>
    </div>
    <div class="task-footer">
        <button class="edit-button">Edit</button>
    </div>
</div>
</body>
</html>
